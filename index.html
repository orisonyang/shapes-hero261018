<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
// 물리 엔진(Rapier)은 별도 스레드(Web Worker)에서 불러옴 — 아래 '물리' 참고
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js';

const hero = document.getElementById('hero');
let idleFrames = 0; // 가만히 있는 프레임 수 (일정 이상이면 다시 그리지 않음)

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;    // 색이 바래지 않는 부드러운 하이키 톤
renderer.toneMappingExposure = 1.0;
hero.appendChild(renderer.domElement);
// 유리 링 굴절용 화면 복사본: three.js는 매 프레임 장면 전체를 화면 해상도 그대로 한 번 더 그려 유리 너머 모습을 만듦
// → 터치 기기(폰·태블릿)에선 이 복사본만 절반 해상도로 (유리를 통해 굴절·분산되어 보이는 부분이라 차이가 거의 안 보임, 화면 해상도는 그대로)
const TOUCH_DEVICE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
let transmissionScale = TOUCH_DEVICE ? 0.5 : 1;
let transmissionRT = null; // (측정용) 굴절 복사본 타깃
{
  const setRT = renderer.setRenderTarget.bind(renderer);
  renderer.setRenderTarget = (rt, ...rest) => {
    // 굴절 복사본: 밉맵 + MSAA 4 + 큐브가 아닌 타깃 (그림자·반사 촬영 타깃과 구분)
    if (rt && !rt.__scaled && rt.samples === 4 && rt.texture.generateMipmaps && !rt.isWebGLCubeRenderTarget) {
      rt.__scaled = true;
      transmissionRT = rt;
      const setSize = rt.setSize.bind(rt);
      rt.setSize = (w, h, d) => setSize(Math.max(1, Math.round(w * transmissionScale)), Math.max(1, Math.round(h * transmissionScale)), d);
    }
    return setRT(rt, ...rest);
  };
}

const scene = new THREE.Scene();
// 배경색 (CSS .hero와 같은 색)
const BG = '#f3ebdc'; // 따뜻한 크림
scene.background = new THREE.Color(BG);
// 조명 색 세 가지: 빛 · 반사광 · 그림자
const LIGHT = '#ffffff';                    // 빛(보조광·반사 속 띠 조명)
const BOUNCE = new THREE.Color('#4d8282');  // 반사광 색 (스크린 효과에만 사용)
const SHADOW = '#8a6440';                   // 그림자(곱하기) — v02와 동일한 따뜻한 갈색

const pmrem = new THREE.PMREMGenerator(renderer);
// 스튜디오 소프트박스 환경: 머리 위 큰 조명판 + 따뜻한 바닥 반사광
// → 모든 도형이 위는 밝고 아래로 갈수록 부드럽게 어두워지는 하이키 명암
function softboxEnv() {
  const env = new THREE.Scene();
  env.background = new THREE.Color('#7d756c');               // 은은한 회갈색 스튜디오 벽
  const box = (w, h, pos, k, color = '#ffffff') => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide })
    );
    m.position.set(...pos);
    m.lookAt(0, 0, 0);
    env.add(m);
  };
  box(12, 12, [4.5, 6.4, -4.5], 2.6);                          // 오른쪽 위 45° 대형 소프트박스 (주광)
  box(6, 4, [-6, 3, 4], 0.7);                                  // 왼쪽 아래 약한 반사판
  box(20, 20, [0, -6, 0], 1.0, '#e9dcc6');                     // 따뜻한 바닥 반사
  return pmrem.fromScene(env, 0.04).texture;
}
scene.environment = softboxEnv();
scene.environmentIntensity = 1.0; // 무광 도형의 주 조명 (유리 링은 자체 envMap 사용)

const camera = new THREE.PerspectiveCamera(35, 16 / 9, 0.1, 100);
camera.position.set(0, 22, 3);
camera.lookAt(0, 0, 0);

// ---------- Lights ----------
// 스튜디오 조명 (v02와 동일): 화면 오른쪽 위에서 약 45° 각도로 내리는 주광 + 은은한 주변광
scene.add(new THREE.HemisphereLight('#ffffff', '#e6d3b8', 0.2));

const sun = new THREE.DirectionalLight('#fffaf2', 1.3);
sun.position.set(10, 14.1, -10);        // 화면 오른쪽 위 방향, 고도 45° → 그림자는 왼쪽 아래로 도형 높이만큼
sun.castShadow = true;
sun.shadow.mapSize.set(768, 768);       // 낮은 해상도 + PCF Soft → 가장자리가 흐릿한 그림자
sun.shadow.camera.left = -20;           // 비스듬한 빛이라 그림자 영역을 넉넉히
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 50;
sun.shadow.bias = -0.0008;
scene.add(sun);

// 카메라 쪽 은은한 보조광: 옆면이 어두워지지 않게
const fill = new THREE.DirectionalLight(LIGHT, 0.35);
fill.position.set(0, 6, 14);
scene.add(fill);


// ---------- Floor ----------
// 그림자를 곱하기(Multiply)로 합성: 배경색 × 그림자색 → 바탕 색감이 살아 있는 자연스러운 그림자
function shadowMultiplyMaterial(color, strength) {
  const m = new THREE.ShadowMaterial({ color, opacity: strength });
  m.toneMapped = false;                    // 그림자 없는 곳은 정확히 흰색(=곱해도 변화 없음)
  m.blending = THREE.CustomBlending;
  m.blendEquation = THREE.AddEquation;
  m.blendSrc = THREE.DstColorFactor;       // 결과 = 그림자색 × 바탕색
  m.blendDst = THREE.ZeroFactor;
  m.onBeforeCompile = sh => {
    sh.fragmentShader = sh.fragmentShader.replace(
      'gl_FragColor = vec4( color, opacity * ( 1.0 - getShadowMask() ) );',
      'gl_FragColor = vec4( mix( vec3( 1.0 ), color, opacity * ( 1.0 - getShadowMask() ) ), 1.0 );'
    );
  };
  return m;
}
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 60),
  shadowMultiplyMaterial(SHADOW, 0.5) // 그림자 (곱하기) — v02와 동일
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ---------- Geometries ----------

  new THREE.TorusGeometry(0.38, 0.15, 48, 96),

  let input = { gx: 0, gz: 0, tiltAmt: 0, homeAmt: 1, pointerActive: false, px: 0, pz: 0, tapBoost: 1, on: true, at: -1e9 };
  let acc = 0, last = 0, steps = 0, ms = 0;
  const INTRO_STEPS = 180; let intro = 0; // 쏟아지는 인트로 남은 걸음
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function makeWorld() {
    if (world) world.free();
    world = new RAPIER.World({ x: 0, y: -cfg.gravity, z: 0 });
    world.timestep = STEP; // 고정 간격: 간격이 들쭉날쭉하면 쌓인 도형이 떨림
    world.integrationParameters.numSolverIterations = cfg.solverIters || 8; // 쌓인 무더기에서도 서로 파고들지 않게 정밀하게 (태블릿 4)
    if (cfg.frictionIters) world.integrationParameters.numAdditionalFrictionIterations = cfg.frictionIters; // 마찰 추가 계산 (기본 4, 태블릿 1)
    // 바닥: 매끄러워 기울이면 미끄러짐
    world.createCollider(RAPIER.ColliderDesc.cuboid(60, 0.5, 60).setTranslation(0, -0.5, 0)
      .setFriction(0.05).setFrictionCombineRule(RAPIER.CoefficientCombineRule.Min));
    walls = [];
  }
  // 벽 (화면 가장자리): 벽에서는 튕김
  function buildWalls(hx, hz) {
    walls.forEach(c => world.removeCollider(c, false));
    const t = 1, h = 10;
    walls = [
      [hx + t, 0, t, h, hz + 2 * t], [-hx - t, 0, t, h, hz + 2 * t],
      [0, hz + t, hx + 2 * t, h, t], [0, -hz - t, hx + 2 * t, h, t],
    ].map(([x, z, ex, ey, ez]) => world.createCollider(
      RAPIER.ColliderDesc.cuboid(ex, ey, ez).setTranslation(x, ey, z).setFriction(0.15)
        .setRestitution(0.55).setRestitutionCombineRule(RAPIER.CoefficientCombineRule.Max)));
  }
  // 도형별 충돌 모양 (Three.js 지오메트리 치수 × 크기)
  function colliderDescs(d) {
    const s = d.s;
    switch (d.kind) {
      case 0: return [RAPIER.ColliderDesc.ball(0.5 * s)];                           // 구
      case 1: return [RAPIER.ColliderDesc.cuboid(0.425 * s, 0.425 * s, 0.425 * s)]; // 정육면체
      case 2: return [RAPIER.ColliderDesc.cone(0.475 * s, 0.48 * s)];               // 원뿔
      case 3: {                                                                     // 링: 고리를 따라 작은 구 12개
        const n = 12, R = 0.38 * s, r = 0.15 * s;
        return Array.from({ length: n }, (_, i) => {
          const a = (i / n) * Math.PI * 2;
          return RAPIER.ColliderDesc.ball(r).setTranslation(Math.cos(a) * R, Math.sin(a) * R, 0);
        });
      }
      case 4: return [RAPIER.ColliderDesc.cylinder(0.4 * s, 0.4 * s)];              // 원기둥
      default: {                                                                    // 딩벳: 볼록 껍질
        const src = hulls[d.hull], pts = new Float32Array(src.length);
        for (let i = 0; i < src.length; i++) pts[i] = src[i] * s;
        return [RAPIER.ColliderDesc.convexHull(pts)];
      }
    }
  }
  function populate(list, hx, hz) {
    makeWorld();
    buildWalls(hx, hz);
    bodies = list.map(d => {
      const b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(d.x, d.y, d.z)
        .setRotation({ x: d.q[0], y: d.q[1], z: d.q[2], w: d.q[3] })
        .setLinearDamping(d.homeDrag)
        .setAngularDamping(0.35)   // 잘 굴러감
        .setCcdEnabled(d.ccd));    // 납작한 딩벳은 서로 파고들지 않게 연속 충돌 검사
      for (const c of colliderDescs(d)) {
        if (d.ring) {
          // 유리 링: 50% 가볍고 탱탱하게 튐 (부딪히는 상대와 관계없이 높은 반발)
          c.setDensity(0.5).setFriction(0.35).setRestitution(0.9).setRestitutionCombineRule(RAPIER.CoefficientCombineRule.Max);
        } else {
          c.setDensity(1).setFriction(0.35).setRestitution(d.bounce); // 도형끼리 적당히 붙잡음
        }
        world.createCollider(c, b);
      }
      return { b, d, mass: b.mass(), hx: 0, hz: 0, returning: false, stuck: 0 };
    });
    // 미리 안착시키지 않고 바로 보여 줌: 위에 놓인 도형이 실제로 떨어져 쌓이는 모습이 첫 화면 연출
    // 처음 3초(인트로)는 돌아올 자리가 도형을 따라다니고, 끝나는 순간 자리 잡은 곳이 '제자리'가 됨
    intro = INTRO_STEPS;
    for (const o of bodies) { const p = o.b.translation(); o.hx = p.x; o.hz = p.z; }
    send();
  }
  // 상자 크기가 조금 바뀜: 벽만 옮기고 밖에 나간 도형을 안으로
  function setBounds(hx, hz) {
    if (!world) return;
    buildWalls(hx, hz);
    for (const o of bodies) {
      const p = o.b.translation(), r = 0.5 * o.d.s;
      const cx = clamp(p.x, -hx + r, hx - r), cz = clamp(p.z, -hz + r, hz - r);
      if (cx !== p.x || cz !== p.z) o.b.setTranslation({ x: cx, y: p.y, z: cz }, true);
      o.hx = clamp(o.hx, -hx + r, hx - r); o.hz = clamp(o.hz, -hz + r, hz - r);
    }
    send();
  }
  // 한 걸음 분량의 힘: 기울기 흐름 · 제자리 복귀 · 손가락/마우스 밀기
  function forces(dt) {
    const { gx, gz, tiltAmt, homeAmt, pointerActive, px, pz, tapBoost } = input;
    const level = homeAmt > 0.01;
    if (intro > 0) intro--;
    for (const o of bodies) {
      const b = o.b, d = o.d, p = b.translation(), m = o.mass;
      if (intro > 0) { o.hx = p.x; o.hz = p.z; o.returning = false; } // 인트로 중: 제자리 = 지금 자리
      const hx = o.hx - p.x, hz = o.hz - p.z, dist = Math.hypot(hx, hz);
      // 실제로 밀려난 도형만 당김: 0.25 넘게 벗어나면 시작해 0.08 안으로 들어올 때까지 (경계에서 들락날락하며 떨지 않게)
      if (dist > 0.25) o.returning = true; else if (dist < 0.08) o.returning = false;
      let ix = 0, iy = 0, iz = 0;
      if (tiltAmt > 0) { ix += gx * d.flow; iz += gz * d.flow; } // 기울기 흐름
      if (o.returning && level) {
        const v = b.linvel();
        // 길이 막혀 1.5초 넘게 못 움직이면 그 자리를 새 자리로 (서로 밀며 떨지 않게)
        o.stuck = Math.hypot(v.x, v.z) < 0.15 ? o.stuck + dt : 0;
        if (o.stuck > 1.5) { o.hx = p.x; o.hz = p.z; o.stuck = 0; }
        else {
          // 수평일 때 원래 자리로: 무게별 목표 속도 (바닥 마찰에 막히지 않게 속도를 맞춤)
          const speed = Math.min(dist * 2, d.homeSpeed), gain = Math.min(1, 6 * dt) * homeAmt / dt;
          ix += (hx / dist * speed - v.x) * gain;
          iz += (hz / dist * speed - v.z) * gain;
        }
      }
      if (pointerActive) { // 밀어내기: 가벼울수록 더 멀리
        const dx = p.x - px, dz = p.z - pz, dd = Math.hypot(dx, dz);
        if (dd < cfg.R && dd > 0.001) {
          const f = (1 - dd / cfg.R) * cfg.pushF * (0.7 / d.rel) * d.pushK * tapBoost;
          ix += dx / dd * f; iz += dz / dd * f; iy += f * d.hopK;
        }
      }
      if (ix || iy || iz) b.applyImpulse({ x: ix * m * dt, y: iy * m * dt, z: iz * m * dt }, true);
      // 저항: 수평일 땐 복귀용 감쇠, 기울이면 무게별 저항
      if (!b.isSleeping()) b.setLinearDamping(lerp(1.5, d.drag, tiltAmt));
    }
  }
  // 상태 보내기: 도형마다 위치3 · 회전4 · 속도3 · 회전속도² · 잠듦 = 12
  // stamp: 이 상태가 해당하는 실제 시각 (아직 계산 안 한 남은 시간만큼 앞) → 화면이 정확한 시점으로 보간
  function send(stamp = performance.timeOrigin + performance.now()) {
    const buf = new Float32Array(bodies.length * 12);
    bodies.forEach((o, i) => {
      const b = o.b, p = b.translation(), q = b.rotation(), v = b.linvel(), w = b.angvel(), k = i * 12;
      buf[k] = p.x; buf[k + 1] = p.y; buf[k + 2] = p.z;
      buf[k + 3] = q.x; buf[k + 4] = q.y; buf[k + 5] = q.z; buf[k + 6] = q.w;
      buf[k + 7] = v.x; buf[k + 8] = v.y; buf[k + 9] = v.z;
      buf[k + 10] = w.x * w.x + w.y * w.y + w.z * w.z;
      buf[k + 11] = b.isSleeping() ? 1 : 0;
    });
    post({ type: 'state', gen, buf, steps, ms, stamp }, [buf.buffer]);
    steps = 0; ms = 0;
  }
  // 고정 간격 반복: 화면이 그리는 동안(입력 신호가 온 지 0.3초 이내)만 돌고, 쉬는 중에는 멈춤
  function loop() {
    setTimeout(loop, 4);
    const now = performance.now();
    if (!world || !bodies.length || !input.on || now - input.at > 300) { last = now; acc = 0; return; }
    acc = Math.min(acc + (now - last) / 1000, 4 * STEP); last = now;
    if (acc < STEP) return;
    // 걸음마다 바로 상태를 보냄 (여러 걸음을 몰아 보내면 화면 보간 간격이 벌어져 멈칫거림)
    while (acc >= STEP) {
      const t0 = performance.now();
      forces(STEP); world.step(); acc -= STEP; steps++;
      ms += performance.now() - t0;
      send(performance.timeOrigin + now - acc * 1000);
    }
  }
  loop();
  return {
    handle(m) {
      if (m.type === 'config') { cfg = m.cfg; hulls = m.hulls; }
      else if (m.type === 'populate') { gen = m.gen; populate(m.list, m.hx, m.hz); }
      else if (m.type === 'bounds') setBounds(m.hx, m.hz);
      else if (m.type === 'input') { input = m.input; input.at = performance.now(); }
    },
  };
}

// 물리 시작: 별도 스레드 → 실패하면 메인에서
const physics = { send: null, mode: '', why: '', gen: 0, onState: null };
// 별도 스레드 시작 코드 (모듈·일반 스레드 둘 다에서 돌아가게 동적 import, 실패하면 이유를 알려 줌)
// physics-worker.js 파일도 이 코드와 같은 내용 (아티팩트에 함께 올림)
const workerBoot = () => `(async () => { try {
  const { default: RAPIER } = await import('${RAPIER_URL}');
  await RAPIER.init();
  const core = (${physicsCore.toString()})(RAPIER, (m, t) => postMessage(m, t));
  onmessage = e => core.handle(e.data);
  postMessage({ type: 'ready' });
} catch (err) { postMessage({ type: 'fail', msg: String((err && err.message) || err) }); } })();`;
function tryWorker(label, make, ms = 8000) {
  return new Promise((resolve, reject) => {
    let w;
    try { w = make(); } catch (err) { reject(new Error(`${label}: ${err.message || err}`)); return; }
    const fail = msg => { clearTimeout(timer); w.terminate(); reject(new Error(`${label}: ${msg}`)); };
    const timer = setTimeout(() => fail('시간 초과'), ms);
    w.onerror = e => { e.preventDefault?.(); fail(e.message || '불러오기 실패'); };
    w.onmessage = e => {
      if (e.data.type === 'fail') fail(e.data.msg);
      else if (e.data.type === 'ready') { clearTimeout(timer); w.onmessage = ev => physics.onState?.(ev.data); resolve(w); }
    };
  });
}
async function startPhysics() {
  // 별도 스레드를 여러 방법으로 시도: ① 함께 올린 파일 ② 일반 스레드(blob) ③ 모듈 스레드(blob) → 모두 안 되면 메인
  const blobURL = () => URL.createObjectURL(new Blob([workerBoot()], { type: 'text/javascript' }));
  const ways = [
    ['파일', () => new Worker(new URL('physics-worker.js', location.href))],
    ['blob', () => new Worker(blobURL())],
    ['blob 모듈', () => new Worker(blobURL(), { type: 'module' })],
  ];
  const why = [];
  for (const [label, make] of ways) {
    try {
      const w = await tryWorker(label, make);
      physics.send = m => w.postMessage(m);
      physics.mode = `별도 스레드·${label}`;
      break;
    } catch (err) { why.push(err.message); }
  }
  physics.why = why.join(' / ');
  if (!physics.send) {
    console.warn('물리: 별도 스레드를 쓸 수 없어 메인에서 계산 —', physics.why);
    const { default: R } = await import(RAPIER_URL);
    await R.init();
    const core = physicsCore(R, m => physics.onState?.(m));
    physics.send = m => core.handle(m);
    physics.mode = '메인';
  }
  physics.send({ type: 'config', cfg: { gravity: GRAVITY, pushF: 40 * SPEED, R: 1.6 * SIZE, solverIters: IS_TABLET ? 4 : 8, frictionIters: IS_TABLET ? 1 : 0 }, hulls: glyphHulls });
}

// ---------- Scatter shapes (InstancedMesh로 수백 개도 가볍게) ----------
const shapes = [];
const bounds = { x: 0, z: 0 }; // 화면 가장자리 = 벽
const group = new THREE.Group();
scene.add(group);

let pendingBodies = [];
let physicsReady = null;
async function populate() {
  group.clear();
  pendingBodies = [];
  shapes.length = 0;
  const { x: hx, z: hz } = visibleHalfExtent();
  const fullS = 1.25 * SIZE;         // 처음 기준 크기
  const maxS = fullS * 0.7;          // 100% 크기 = 기준의 70%
  const minS = fullS * 0.3;          // 30% 크기 (기준 대비)

  // 크기 5단계 (0.6~1.4를 다섯 구간으로) 별 개수
  const pick = t => minS + (maxS - minS) * t;
  const band = (a, b) => () => pick(a + Math.random() * (b - a));
  const tiers = [
    { count: 340, size: band(0, 0.025) },             // 1단계: 가장 작은 크기에 몰림
    { count: 44,  size: band(0.025, 0.2) },           // 1단계 나머지
    { count: 110, size: band(0.2, 0.4), fresh: 57 },  // 2단계: 늘어난 57개는 새 모양 우선
    { count: 80,  size: band(0.4, 0.6) },             // 3단계
    { count: 60,  size: band(0.6, 0.8) },             // 4단계
    { count: 30,  size: band(0.8, 1.0) },             // 5단계: 이전(60)의 절반
  ].map(t => ({ ...t, count: Math.round(t.count * countScale), fresh: Math.round((t.fresh || 0) * countScale) })); // 화면 넓이에 맞춰 개수 조절
  const sizes = tiers.flatMap(t => Array.from({ length: t.count }, (_, i) => ({ s: t.size(), fresh: i < (t.fresh || 0) })));
  sizes.sort((a, b) => b.s - a.s); // 큰 도형부터 놓고 틈새를 작은 도형으로 채움

  // 겹침 검사용 공간 해시
  const cellSize = maxS;
  const grid = new Map();
  const key = (i, j) => i * 10000 + j;
  const fits = (x, z, r, overlap) => {
    const ci = Math.floor(x / cellSize), cj = Math.floor(z / cellSize);
    for (let i = ci - 1; i <= ci + 1; i++) for (let j = cj - 1; j <= cj + 1; j++) {
      const bucket = grid.get(key(i, j));
      if (!bucket) continue;
      for (const p of bucket) {
        const min = (p.r + r) * overlap;
        const dx = p.x - x, dz = p.z - z;
        if (dx * dx + dz * dz < min * min) return false;
      }
    }
    return true;
  };

  const specs = [];
  bounds.x = hx; // 화면 가장자리 = 벽 (물리 쪽으로 함께 보냄)
  bounds.z = hz;
  // 공중에서 떨어뜨리기: 아무 데나, 아무 각도로 → 다른 도형 위에 올라타거나 기대어 자연스럽게 쌓임
  const drops = [];
  const drop = (s, geo) => drops.push({ s, geo });
  const place = (x, z, r, s, geo, pose) => {
    const k = key(Math.floor(x / cellSize), Math.floor(z / cellSize));
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push({ x, z, r });
    specs.push({
      x, z, s, geo, pose,
      mat: specs.length % palette.length, // 크기 순서대로 돌려가며 → 크기별로도 색이 고르게
    });
  };
  // 남은 틈을 촘촘히 훑어 자리 찾기 (무작위 시도로 놓친 작은 틈까지)
  const scan = (r, overlap) => {
    const step = r * 0.35, spots = [];
    for (let x = -hx + r; x <= hx - r; x += step)
      for (let z = -hz + r; z <= hz - r; z += step)
        if (fits(x, z, r, overlap)) spots.push([x, z]);
    return spots.length ? spots[Math.floor(Math.random() * spots.length)] : null;
  };

  for (const { s, fresh } of sizes) {
    let geo = Math.floor(Math.random() * GLYPH0);     // 원래 5종 비율 그대로 고른 뒤
    if (REPLACED.has(geo)) geo = randomGlyph();        // 정육면체·원뿔·원기둥은 무작위 딩벳으로
    if (fresh && Math.random() < 0.75) geo = freshGlyph(); // 새로 늘어난 도형은 대부분 새 모양 (일부는 구·링으로 재질 균형)
    if (Math.random() < DROP_RATIO) { drop(s, geo); continue; }
    const pose = POSES[geo][Math.floor(Math.random() * POSES[geo].length)];
    const r = pose.r * s; // 놓인 자세의 바닥 반경
    let done = false;
    for (let tries = 0; tries < 1500 && !done; tries++) {
      const x = (Math.random() * 2 - 1) * (hx - r);
      const z = (Math.random() * 2 - 1) * (hz - r);
      if (fits(x, z, r, 1)) { place(x, z, r, s, geo, pose); done = true; }
    }
    if (done) continue;
    // 무작위로 못 찾으면: 가장 작게 서는 자세로 남은 틈을 훑고, 그래도 없으면 위에서 떨어뜨림
    const slim = POSES[geo].reduce((a, b) => (b.r < a.r ? b : a));
    const spot = scan(slim.r * s, 1);
    if (spot) place(spot[0], spot[1], slim.r * s, s, geo, slim);
    else drop(s, geo);
  }

  // 떨어뜨릴 도형은 바닥 도형 바로 위를 겨냥 → 위에 얹히거나, 기대거나, 굴러 내려가 틈에 끼임
  const floorSpecs = specs.slice();
  const stackH = new Map(); // 같은 도형 위로 여러 개가 떨어질 때 공중에서 겹치지 않게 높이를 쌓음
  for (const d of drops) {
    const base = floorSpecs[Math.floor(Math.random() * floorSpecs.length)];
    const h = stackH.get(base) ?? base.pose.y * base.s * 2 + 0.1;
    const a = Math.random() * Math.PI * 2, off = Math.random() * 0.35 * base.s;
    specs.push({
      x: THREE.MathUtils.clamp(base.x + Math.cos(a) * off, -hx + 0.5 * d.s, hx - 0.5 * d.s),
      z: THREE.MathUtils.clamp(base.z + Math.sin(a) * off, -hz + 0.5 * d.s, hz - 0.5 * d.s),
      y: h + 0.75 * d.s,
      s: d.s, geo: d.geo, drop: true,
      mat: specs.length % palette.length,
    });
    stackH.set(base, h + 1.5 * d.s);
  }

  // 털 구: 작은 구에만 몰리지 않게 크기별로 고르게 (작은 구 25%, 그보다 큰 구 55%), 색은 무작위
  for (const sp of specs) {
    if (sp.geo !== SPHERE) continue;
    if (Math.random() < (sp.s < pick(0.2) ? FUR_RATIO_SMALL : FUR_RATIO_LARGE)) {
      sp.metal = true;
      sp.mat = Math.floor(Math.random() * palette.length);
    }
  }

  // 털 구의 절반을 무작위로 쇠구슬로 (크기·색은 그대로)
  const furList = specs.filter(sp => sp.geo === SPHERE && sp.metal);
  for (let i = furList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [furList[i], furList[j]] = [furList[j], furList[i]];
  }
  furList.slice(0, Math.round(furList.length * STEEL_RATIO)).forEach(sp => { sp.steel = true; });

  // 일반(무광) 구 개수를 크기 단계별로 맞춤: 많으면 딩벳으로, 모자라면 딩벳을 구로 (단계별 총 개수·털 구는 그대로)
  const tierOf = sp => Math.min(4, Math.floor((sp.s - minS) / ((maxS - minS) / 5) + 1e-9));
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  MATTE_SPHERES.forEach(([lo0, hi0], t) => {
    const lo = Math.round(lo0 * countScale), hi = Math.max(lo, Math.round(hi0 * countScale));
    const want = lo + Math.floor(Math.random() * (hi - lo + 1));
    const inTier = specs.filter(sp => tierOf(sp) === t);
    const matte = shuffle(inTier.filter(sp => sp.geo === SPHERE && !sp.metal));
    const glyphs = shuffle(inTier.filter(sp => sp.geo >= GLYPH0));
    while (matte.length > want) {
      const sp = matte.pop();
      sp.geo = randomGlyph();
      sp.pose = POSES[sp.geo][0];
    }
    for (let n = matte.length; n < want && glyphs.length; n++) {
      const sp = glyphs.pop();
      sp.geo = SPHERE;
      sp.pose = POSES[SPHERE][0];
    }
  });

  // 도형×세밀도×재질 조합마다 InstancedMesh 하나
  // 바닥 1단위가 화면에서 차지하는 픽셀. 터치 기기는 화면 점(CSS 픽셀) 기준 → 레티나 화면에서 기기 픽셀 0.5 미만 오차까지 허용 (여전히 구분 불가)
  const ppu = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * hz) / (TOUCH_DEVICE ? renderer.getPixelRatio() : 1);
  const buckets = new Map();
  for (const sp of specs) {
    sp.lod = lodLevel(sp.geo, sp.s, ppu);
    const k = `${sp.geo}-${sp.lod}-${sp.steel ? 'steel' : sp.metal ? 'fur' : 'matte'}`; // 색은 묶지 않음 (인스턴스 색)
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(sp);
  }
  for (const list of buckets.values()) {
    const isRing = list[0].geo === RING;
    const kind = isRing ? 'ring' : list[0].steel ? 'steel' : list[0].metal ? 'fur' : 'matte';
    const mat = { ring: glass, steel: steelAll, fur: furCoreAll, matte: matteAll }[kind]; // 유리 / 쇠구슬 / 털 구(속) / 무광
    const inst = new THREE.InstancedMesh(lodGeometry(list[0].geo, list[0].lod), mat, list.length);
    inst.renderOrder = DRAW_ORDER[kind];
    inst.userData.lod = list[0].lod; // (측정용) 세밀도 단계 = 화면에서 작게 보이는 정도
    if (!isRing) list.forEach((sp, idx) => inst.setColorAt(idx, new THREE.Color(palette[sp.mat]))); // 유리는 무색 그대로
    inst.castShadow = !isRing; // 유리는 진한 그림자를 만들지 않음
    inst.receiveShadow = true;
    inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    group.add(inst);
    list.forEach((sp, idx) => addShape(sp, inst, idx, maxS));
  }
  // 셰이더(재질) 준비와 물리 엔진 준비를 동시에 → 첫 화면이 바로 그려짐
  await Promise.all([physicsReady, renderer.compileAsync ? renderer.compileAsync(scene, camera) : null]);
  await settle(hx, hz);
}


// 무게별 흐름: 가장 무거운 도형이 가장 가벼운 도형보다 5배 이상 빠르게 흐르고, 원래 자리로도 그만큼 빨리 돌아감
function flowParams(rel) {
  const t = THREE.MathUtils.clamp((rel - 0.5) / 0.5, 0, 1); // 0 = 가장 가벼움, 1 = 가장 무거움
  const lerp = THREE.MathUtils.lerp;
  const homeK = 6 * lerp(0.2, 1, t) ** 2;                   // 복귀 스프링: 가벼우면 5배 느리게
  return {
    flow: lerp(0.2, 1, t),      // 기울기에 반응하는 힘 (가벼우면 1/5)
    drag: lerp(1.4, 0.5, t) * TILT_SNAP, // 기울였을 때 저항 (무게별, 방향 전환 반응만큼 키움)
    homeK,
    homeDrag: 2 * Math.sqrt(homeK), // 출렁이지 않고 딱 맞게 멈추는 감쇠
    homeSpeed: lerp(0.6, 3, t) * SPEED, // 원래 자리로 돌아가는 속도 (가벼우면 1/5)
  };
}

const _q = new THREE.Quaternion(), _e = new THREE.Euler();
function addShape({ x, y, z, s, geo, pose, drop, metal, steel: isSteel, mat }, inst, idx, maxS) {
  const obj = new THREE.Object3D();
  obj.scale.setScalar(s);
  const rel = s / maxS;
  const fp = flowParams(rel);
  const bounce = 0.15 + 0.2 * (1 - rel); // v08처럼 도형끼리 살짝 튕김 (가벼울수록 조금 더, 벽에서는 벽 쪽 반발로 더 튕김)
  // 바닥에 놓는 도형: 안정된 자세 + 무작위 방향 / 떨어뜨리는 도형·구: 아무 각도
  if (drop || geo === SPHERE) _q.setFromEuler(_e.set(Math.random() * 6.3, Math.random() * 6.3, Math.random() * 6.3));
  else _q.setFromEuler(_e.set(pose.tilt[0], Math.random() * Math.PI * 2, pose.tilt[2], 'YXZ'));
  const ring = geo === RING;
  pendingBodies.push({
    kind: geo >= GLYPH0 ? -1 : geo, hull: geo - GLYPH0, s,
    x, y: drop ? y : pose.y * s + 0.01, z, q: [_q.x, _q.y, _q.z, _q.w],
    ccd: geo >= GLYPH0, ring, bounce,
    rel, flow: fp.flow, drag: fp.drag, homeDrag: fp.homeDrag, homeSpeed: fp.homeSpeed,
    pushK: ring ? 2 : 1,     // 같은 힘에도 링은 2배 멀리 밀려남 (질량 절반)
    hopK: ring ? 0.7 : 0.25, // 마우스에 밀릴 때 위로 튀어오르는 정도
  });
  shapes.push({
    mesh: obj, inst, idx,
    vCurr: new THREE.Vector3(), vNow: new THREE.Vector3(), w2: 0, sleeping: false, // 물리에서 받은 최신 속도·화면 시점 속도·회전속도²·잠듦
    fur: !!metal && !isSteel, // 털 구 (쇠구슬은 털 없음)
    // 물리 상태 직전·현재 (화면은 두 상태 사이를 보간해 그림 → 화면 주사율과 물리 간격이 달라도 매끄럽게)
    currP: new THREE.Vector3(), // 최신 물리 위치 (움직임 판단용)
    colorIdx: mat,
  });
}

// 물리 상태 받기: 직전 상태 ← 현재, 현재 ← 새 상태 (화면은 그 사이를 보간)
// 최근 물리 상태 기록 (각 상태가 해당하는 실제 시각과 함께) → 화면은 조금 과거 시각을 골라 두 상태 사이를 보간
const history = [];
const MIN_DELAY = 1000 / 60 + 4; // 기본: 한 걸음(+여유)만큼 과거를 그림
let renderDelay = MIN_DELAY;     // 물리가 바빠 상태가 늦게 몰려 오면 그만큼 늘림 (끊기지 않게), 여유가 생기면 천천히 줄임
const physStats = { steps: 0, ms: 0 }; // FPS 표시용: 물리 걸음 수·계산 시간 (별도 스레드에서 쓴 시간)
function applyState(m) {
  if (m.gen !== physics.gen || m.buf.length !== shapes.length * 12) return; // 다시 채우는 중 도착한 이전 상태는 버림
  history.push({ stamp: m.stamp, buf: m.buf });
  if (history.length > 16) history.shift();
  const b = m.buf;
  shapes.forEach((sh, i) => { // 최신 상태: 움직임 판단·잠듦·깨어 있는 수에 사용
    const k = i * 12;
    sh.currP.set(b[k], b[k + 1], b[k + 2]);
    sh.vCurr.set(b[k + 7], b[k + 8], b[k + 9]);
    sh.w2 = b[k + 10];
    sh.sleeping = b[k + 11] > 0.5;
  });
  physStats.steps += m.steps; physStats.ms += m.ms;
}
// 첫 화면 전에 물리 쪽에서 미리 떨어뜨려 바닥에 안착시킴
function settle(hx, hz) {
  const gen = ++physics.gen;
  return new Promise(resolve => {
    physics.onState = m => {
      if (m.gen !== gen) return;
      applyState(m);
      physics.onState = applyState;
      history.length = 0;
      history.push({ stamp: m.stamp, buf: m.buf });
      shapes.forEach((sh, i) => syncShape(sh, true, m.buf, m.buf, 1, i * 12));
      for (const inst of group.children) inst.instanceMatrix.needsUpdate = true;
      resolve();
    };
    physics.send({ type: 'populate', gen, list: pendingBodies, hx, hz });
  });
}

// 화면 갱신: 두 물리 상태 A·B 사이를 alpha(0~1)만큼 보간해 그림 (k = 상태 배열 안 이 도형의 위치)
// 천천히 움직이며 아주 미세하게만 바뀌면 그리지 않음 → 쌓인 도형의 접촉 떨림이 보이지 않게
const _ip = new THREE.Vector3(), _iq = new THREE.Quaternion(), _qa = new THREE.Quaternion(), _qb = new THREE.Quaternion();
function syncShape(sh, force, A, B, alpha, k) {
  const u = 1 - alpha;
  _ip.set(A[k] * u + B[k] * alpha, A[k + 1] * u + B[k + 1] * alpha, A[k + 2] * u + B[k + 2] * alpha);
  _qa.set(A[k + 3], A[k + 4], A[k + 5], A[k + 6]); _qb.set(B[k + 3], B[k + 4], B[k + 5], B[k + 6]);
  _iq.slerpQuaternions(_qa, _qb, alpha);
  sh.vNow.set(A[k + 7] * u + B[k + 7] * alpha, A[k + 8] * u + B[k + 8] * alpha, A[k + 9] * u + B[k + 9] * alpha); // 털 흔들림용
  if (!force) {
    const slow = sh.vNow.lengthSq() < 0.36 && B[k + 10] < 1;
    if (slow) {
      const m = sh.mesh.position, q = sh.mesh.quaternion;
      const dp = Math.abs(_ip.x - m.x) + Math.abs(_ip.y - m.y) + Math.abs(_ip.z - m.z);
      const dq = 1 - Math.abs(q.x * _iq.x + q.y * _iq.y + q.z * _iq.z + q.w * _iq.w);
      if (dp < 0.03 && dq < 0.0008) return;
    }
  }
  sh.mesh.position.copy(_ip);
  sh.mesh.quaternion.copy(_iq);
  sh.mesh.updateMatrix();
  sh.inst.setMatrixAt(sh.idx, sh.mesh.matrix);
}

// ---------- Resize: 상자 비율이 바뀌면 구도·벽·개수를 다시 맞춤 ----------
let builtAspect = 0, rebuildTimer = 0;
function resize() {
  idleFrames = 0;
  const w = Math.max(1, hero.clientWidth), h = Math.max(1, hero.clientHeight);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  applyFraming(camera.aspect);
  camera.updateProjectionMatrix();
  if (!builtAspect) return; // 첫 배치 전
  const a0 = builtAspect, a1 = camera.aspect;
  const flipped = (a0 >= 1) !== (a1 >= 1);
  const changed = Math.abs(Math.log(a1 / a0)) > 0.2;
  clearTimeout(rebuildTimer);
  if (flipped || changed) {
    // 가로↔세로 회전이나 큰 비율 변화: 잠시 뒤 새 비율로 다시 채움
    rebuildTimer = setTimeout(() => {
      populate().then(() => { buildFur(); builtAspect = camera.aspect; lastCapture = -1; idleFrames = 0; });
    }, 250);
  } else {
    // 작은 변화: 벽만 옮기고 밖에 나간 도형을 안으로
    const { x: hx, z: hz } = visibleHalfExtent();
    bounds.x = hx; bounds.z = hz;
    physics.send({ type: 'bounds', hx, hz }); // 물리 쪽에서 벽을 옮기고 밖에 나간 도형을 안으로
  }
}
// ---------- 털 구: 셸(겹겹이 커지는 껍질) 방식 털 + 움직임에 따라 흔들리는 스프링 ----------
const FUR_LAYERS = 20;   // 털 껍질 수 (많을수록 층이 끊겨 보이지 않고 매끄럽게 이어짐)
const FUR_LEN = 0.22;    // 털 길이 (크기 1 기준, 구 반지름 0.5)
const FUR_K = 90;        // 털 탄성 (클수록 빨리 제자리로)
const FUR_C = 7;         // 털 감쇠 (작을수록 출렁임이 오래감)
const FUR_SAG = 0.03;    // 털이 아래로 살짝 처지는 정도
const furGeo = new THREE.SphereGeometry(0.5, 16, 12); // 털 껍질: 가장자리가 털로 흐릿해 그물망이 성겨도 구분 안 됨 (20겹이라 성능 차이 큼)
// 털 가닥 지도
//  R: 가닥 길이 — 다발(터프트) 중심일수록 길고, 바깥 껍질로 갈수록 남는 가닥이 줄어 끝이 가늘어짐
//  G·B: 다발마다 살짝 다른 결 방향 → 가닥이 한쪽으로 기울어 빗질한 듯한 결
const strandTex = (() => {
  const w = 512, h = 256, cell = 8, data = new Uint8Array(w * h * 4);
  const cw = w / cell, ch = h / cell;
  const cells = Array.from({ length: cw * ch }, () => ({
    cx: Math.random() * cell, cy: Math.random() * cell,
    dx: Math.random(), dy: Math.random(), boost: 0.6 + Math.random() * 0.4,
  }));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = cells[Math.floor(y / cell) * cw + Math.floor(x / cell)];
    const d = Math.hypot((x % cell) - c.cx, (y % cell) - c.cy) / cell;      // 다발 중심에서의 거리
    const len = Math.pow(Math.random(), 0.7) * (0.45 + 0.55 * Math.max(0, 1 - d * 1.3)) * c.boost;
    const i = (y * w + x) * 4;
    data[i] = Math.min(255, len * 255);
    data[i + 1] = c.dx * 255;
    data[i + 2] = c.dy * 255;
    data[i + 3] = 255;
  }
  const t = new THREE.DataTexture(data, w, h);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
})();
// 털 재질: 실루엣이 보송보송하게 (MSAA 알파 커버리지로 가장자리를 부드럽게)
const furMat = new THREE.MeshStandardMaterial({ roughness: 0.7, metalness: 0, alphaToCoverage: true });
const KEY_DIR = new THREE.Vector3(10, 14.1, -10).normalize(); // 주광 방향 (털 광택 계산용)
furMat.onBeforeCompile = sh => {
  sh.uniforms.uStrands = { value: strandTex };
  sh.uniforms.uLen = { value: FUR_LEN };
  sh.uniforms.uKeyDir = { value: KEY_DIR };
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', `#include <common>
attribute float aLayer;
attribute vec3 aOffset;
uniform float uLen;
varying float vLayer;
varying vec2 vFurUv;`)
    .replace('#include <begin_vertex>', `#include <begin_vertex>
vLayer = aLayer;
vFurUv = uv;
// 다발마다 흔들림 정도가 조금씩 다름 (구 표면을 따라 부드럽게 변함)
float sway = 0.75 + 0.25 * sin(uv.x * 25.0 + uv.y * 13.0) * cos(uv.y * 17.0 - uv.x * 9.0);
// 바깥 껍질일수록 길게 뻗고, 흔들림(aOffset)은 끝으로 갈수록 크게 휨
transformed += objectNormal * uLen * aLayer + aOffset * aLayer * aLayer * sway;`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
uniform sampler2D uStrands;
uniform vec3 uKeyDir;
varying float vLayer;
varying vec2 vFurUv;`)
    .replace('#include <color_fragment>', `#include <color_fragment>
vec2 suv = vFurUv * vec2(1.6, 0.8);
vec2 lean = (texture2D(uStrands, suv).gb - 0.5) * 0.014 * vLayer;   // 바깥으로 갈수록 결 방향으로 기울어짐
float strand = texture2D(uStrands, suv + lean).r;
float thr = 0.08 + vLayer * 0.85;
float furAlpha = smoothstep(thr, thr + 0.07, strand);              // 가닥 끝이 부드럽게 가늘어짐
furAlpha *= 1.0 - smoothstep(0.65, 1.0, vLayer) * 0.55;             // 바깥 껍질은 반투명 → 보송한 실루엣
if (furAlpha < 0.02) discard;
diffuseColor.a = furAlpha;
diffuseColor.rgb *= mix(0.45, 1.2, vLayer);                          // 뿌리는 어둡고 끝은 밝게`)
    .replace('#include <opaque_fragment>', `
// 털 전용 조명: 가닥 방향(바깥쪽)을 따라 흐르는 비단결 광택 + 털끝이 빛을 머금는 역광
vec3 furV = normalize(vViewPosition);
vec3 furT = normalize(normal);
vec3 furL = normalize((viewMatrix * vec4(uKeyDir, 0.0)).xyz);
vec3 furH = normalize(furL + furV);
float tH = dot(furT, furH);
float sinTH = sqrt(max(0.0, 1.0 - tH * tH));
float facing = clamp(dot(furT, furL) * 0.5 + 0.5, 0.0, 1.0);
outgoingLight += (vec3(pow(sinTH, 80.0)) * 0.16 + diffuseColor.rgb * pow(sinTH, 12.0) * 0.22) * facing * vLayer;
float furRim = pow(1.0 - max(dot(furT, furV), 0.0), 3.0);
outgoingLight += diffuseColor.rgb * furRim * vLayer * 0.35;
#include <opaque_fragment>`);
};
furMat.customProgramCacheKey = () => 'fur-shell-v2';

let furMesh = null;
const furShapes = [];
function buildFur() {
  if (furMesh) { scene.remove(furMesh); furMesh.geometry.dispose(); }
  furShapes.length = 0;
  furShapes.push(...shapes.filter(sh => sh.fur));
  const n = furShapes.length * FUR_LAYERS;
  const geo = furGeo.clone();
  const layer = new Float32Array(n);
  const offAttr = new THREE.InstancedBufferAttribute(new Float32Array(n * 3), 3);
  offAttr.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aLayer', new THREE.InstancedBufferAttribute(layer, 1));
  geo.setAttribute('aOffset', offAttr);
  furMesh = new THREE.InstancedMesh(geo, furMat, n);
  furMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  furMesh.frustumCulled = false;
  furMesh.renderOrder = DRAW_ORDER.furShell;
  furMesh.receiveShadow = true;
  furShapes.forEach((sh, i) => {
    sh.furBase = i * FUR_LAYERS;
    sh.furOff = new THREE.Vector3();   // 털 끝의 휨 (월드 기준)
    sh.furVel = new THREE.Vector3();
    sh.prevVel = new THREE.Vector3();
    const c = new THREE.Color(palette[sh.colorIdx]);
    for (let k = 0; k < FUR_LAYERS; k++) {
      layer[sh.furBase + k] = (k + 1) / FUR_LAYERS;

}

// 털 흔들림: 구가 움직이는 반대쪽으로 끌리고(관성·공기저항), 멈추면 스프링처럼 출렁이다 제자리로
const _fv = new THREE.Vector3(), _ft = new THREE.Vector3(), _fq = new THREE.Quaternion();
function updateFur(dt) {
  if (!furMesh) return;
  const offAttr = furMesh.geometry.attributes.aOffset;
  for (const sh of furShapes) {
    _fv.copy(sh.vNow);
    // 목표 휨 = 가속의 반대(관성) + 속도의 반대(바람에 날림)
    _ft.copy(_fv).sub(sh.prevVel).multiplyScalar(-0.012 / Math.max(dt, 1e-3)).addScaledVector(_fv, -0.035);
    _ft.y -= FUR_SAG * sh.mesh.scale.x; // 털이 아래로 살짝 처짐
    sh.prevVel.copy(_fv);
    // 스프링-감쇠: 목표를 따라가며 살짝 넘쳤다 돌아오는 탄성
    sh.furVel.addScaledVector(_ft.sub(sh.furOff), FUR_K * dt).multiplyScalar(Math.exp(-FUR_C * dt));
    sh.furOff.addScaledVector(sh.furVel, dt);
    const len = sh.furOff.length(), maxLen = 0.6 * FUR_LEN * sh.mesh.scale.x * 2;
    if (len > maxLen) sh.furOff.multiplyScalar(maxLen / len);
    // 월드 기준 휨 → 구의 회전·크기를 되돌린 로컬 값으로
    _fq.copy(sh.mesh.quaternion).invert();
    _fv.copy(sh.furOff).applyQuaternion(_fq).divideScalar(sh.mesh.scale.x);
    for (let k = 0; k < FUR_LAYERS; k++) {
      offAttr.setXYZ(sh.furBase + k, _fv.x, _fv.y, _fv.z);
      furMesh.setMatrixAt(sh.furBase + k, sh.mesh.matrix);
    }
  }
  offAttr.needsUpdate = true;
  furMesh.instanceMatrix.needsUpdate = true;
}

// ---------- Animate ----------
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();

const G = 26 * SPEED * TILT_SNAP; // 기울기 흐름 세기

// ---------- 성능: 화면 밖이면 멈춤 · 가만히 있으면 다시 그리지 않음 · 프레임이 느리면 해상도를 자동으로 낮춤 ----------
let heroVisible = true;
new IntersectionObserver(([e]) => { heroVisible = e.isIntersecting; }).observe(hero);
let motionFrames = 0, sceneMoving = true;

// (웹 게시용: 측정 기능 없음 — 그리기 루프가 참조하는 기본값만)
const tests = { capture: true, physics: true, simTilt: false };
const fpsTests = { hidden: true };
const bench = { on: false };
const perf = { captures: 0, captureMs: 0, cpu: 0, awake: 0, frames: 0, tris: 0, calls: 0, worst: 0, gap: 0, slow: 0 };
function perfFrame() {}

function tick() {

  const dt = Math.min(clock.getDelta(), 1 / 30);
  const t = clock.elapsedTime;
  if (!heroVisible) return; // 스크롤해서 화면 밖에 있으면 물리·그리기 모두 쉼

  // 기울기 결정: 방향키 > 마우스 드래그 > 기기 센서 순
  const kx = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
  const ky = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0);

  else if (tests.simTilt) tiltTarget.set(0.55 * Math.sin(t * 0.9), 0.45 * Math.sin(t * 0.6 + 1)); // 기울기 흉내: 천천히 이리저리

  if (tiltTarget.length() < 0.08) tiltTarget.set(0, 0); // 손떨림 데드존
  tiltSmooth.lerp(tiltTarget, 1 - Math.pow(0.0002, dt)); // 센서 떨림만 거르고 거의 바로 따라감

  // 입력이 있으면(기울기·드래그·방향키·최근 손가락/마우스 움직임) 바로 깨어남
  const pointerRecent = performance.now() - lastPointerMoveAt < 600;
  const inputActive = tiltTarget.lengthSq() > 0 || tiltSmooth.lengthSq() > 1e-6 || dragging ||
    keys.size > 0 || pointerRecent;
  if (!inputActive && idleFrames > 60 && fpsTests.hidden) return; // 쉬는 중: 물리·그리기 생략 (원인 찾기 패널이 열려 있으면 계속 그려 측정)

  const cpu0 = performance.now(); // 이 프레임의 CPU 작업 시간 측정 시작
  // 기울기가 클수록 가속이 급격히 커짐 (살짝 = 천천히, 많이 = 빠르게)
  const tl = tiltSmooth.length();
  const accel = tl > 0.001 ? G * Math.pow(Math.min(tl, 1), 1.5) / tl : 0;
  const gx = tiltSmooth.x * accel, gz = tiltSmooth.y * accel;

  // 물리(별도 스레드)에 이번 프레임의 입력을 보냄 → 물리는 초당 60번 따로 계산해 상태를 돌려줌

    gx, gz, tiltAmt, homeAmt, pointerActive, px: pointer.x, pz: pointer.z,

  const nowAbs = performance.timeOrigin + performance.now();
  let awake = 0;
  if (history.length) {
    const age = nowAbs - history[history.length - 1].stamp; // 가장 최근 상태가 얼마나 지났나
    // 늦게 몰려 오면 바로 늘리고, 여유가 생기면 천천히(초당 0.3초) 줄임.
    // 0.25초 넘게 새 상태가 없으면 쉬는 중(물리 멈춤)이라 늦은 게 아님 → 늘리지 않음
    renderDelay = Math.max(MIN_DELAY, age < 250 ? age + 2 : MIN_DELAY, Math.min(renderDelay, 250) - dt * 1000 * 0.3);
    const rt = nowAbs - renderDelay;
    let j = history.length - 2;
    while (j > 0 && history[j].stamp > rt) j--;
    const a = history[Math.max(j, 0)], b = history[Math.min(j + 1, history.length - 1)];
    const alpha = b.stamp > a.stamp ? THREE.MathUtils.clamp((rt - a.stamp) / (b.stamp - a.stamp), 0, 1) : 1;

  // 0.5초 동안 실제로 자리를 옮긴 거리(순이동)로 판단
  motionFrames++;
  if (motionFrames >= 30) {
    motionFrames = 0;
    let maxNet = 0, movers = 0;
    for (const sh of shapes) {
      const p = sh.currP;
      if (sh.snapP) {
        const net = Math.abs(p.x - sh.snapP.x) + Math.abs(p.z - sh.snapP.z) + Math.abs(p.y - sh.snapP.y);
        if (net > 0.04) movers++;
        maxNet = Math.max(maxNet, net);
      } else sh.snapP = {};
      sh.snapP.x = p.x; sh.snapP.y = p.y; sh.snapP.z = p.z;
    }
    // 눈에 띄게 움직이는 도형이 거의 없으면(전체의 1% 이하, 0.5초에 0.25 미만) 멈춘 것으로 봄
    sceneMoving = movers > Math.max(5, shapes.length * 0.01) || maxNet > 0.25;
  }
  updateFur(dt);
  for (const inst of group.children) inst.instanceMatrix.needsUpdate = true;


  // 주변 반사 갱신: 처음 한 번, 이후 도형이 움직이는 동안 1.5초마다
  if (lastCapture < 0 || (tests.capture && awake > 20 && t - lastCapture > 1.5)) {
    const c0 = performance.now();
    captureReflections();
    perf.captures++; perf.captureMs = Math.max(perf.captureMs, performance.now() - c0);
    lastCapture = t;
    idleFrames = 0;
  }

  // 눈에 띄는 움직임도 입력도 없으면 쉬는 상태로 (1초 뒤부터 물리·털·그리기를 모두 멈춤)
  idleFrames = (!sceneMoving && !inputActive) ? idleFrames + 1 : 0;

  renderer.render(scene, camera);
  perf.cpu += performance.now() - cpu0;
  // 실제로 그린 프레임만 셈 (쉬는 중엔 그리지 않으므로 제외)
  perf.awake = awake; perf.frames++;
  perf.tris = renderer.info.render.triangles; perf.calls = renderer.info.render.calls;
  if (bench.on) { bench.frames++; bench.cpu += performance.now() - cpu0; }
  perf.worst = Math.max(perf.worst, perf.gap);
  if (perf.gap > 1000 / 30) perf.slow++;
}
tick();
</script>
</body>
</html>
